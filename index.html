<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e151d">
<title>SLAM — автозаполнение</title>
<style>
  :root {
    --bg:#0e151d; --bg2:#0b1219; --card:#18232f; --card2:#1f2d3b;
    --line:#2b3a49; --line2:#36495b;
    --text:#eaf1f7; --muted:#8ea0b2; --muted2:#6f8295;
    --accent:#2fa566; --accent-h:#37bd76;
    --blue:#3a7bd5; --blue-h:#4a8be6;
    --danger:#d35650; --danger-h:#e46760;
    --warn:#d9a441;
    --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.45);
    /* непрозрачные фоны для «липких» панелей: backdrop-filter заставлял
       телефон переразмывать весь экран на каждом кадре прокрутки */
    --barbg:#131c25;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html,body { margin:0; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body {
    font-family:-apple-system,Segoe UI,Roboto,Inter,sans-serif;
    background:var(--bg);
    color:var(--text); line-height:1.45;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    overscroll-behavior-y:none;
  }
  /* Фоновый градиент отдельным закреплённым слоем. Раньше был
     background-attachment:fixed на body — на мобильных это перерисовывает
     фон на каждом кадре прокрутки и было главной причиной «тормозов». */
  body::before {
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(1200px 600px at 50% -10%, #16222e 0%, var(--bg) 55%);
  }

  header {
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
    background:var(--barbg);
    position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  header .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  header h1 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #addBlock { white-space:nowrap; flex:none; }
  header .logo { width:30px; height:30px; border-radius:8px; flex:none;
    background:linear-gradient(135deg,var(--accent),var(--blue)); display:grid; place-items:center;
    font-weight:800; font-size:14px; color:#fff; }
  header h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:.2px; }
  header .sub { font-size:11px; color:var(--muted2); margin-top:1px; }

  .wrap { max-width:680px; margin:0 auto; padding:16px 14px; }

  .card {
    background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:18px; box-shadow:0 4px 14px rgba(0,0,0,.28);
  }

  /* режим выбора блоков (по долгому нажатию) */
  #selbar { display:none; position:sticky; top:0; z-index:30; gap:12px;
    align-items:center; justify-content:space-between;
    padding:12px 16px; background:var(--barbg);
    border-bottom:1px solid var(--line2);
    padding-top:calc(12px + env(safe-area-inset-top)); }
  body.selecting #selbar { display:flex; }
  body.selecting header { display:none; }
  #selbar .selcount { font-size:15px; color:var(--text); }
  #selbar #selDelete { background:var(--danger); display:inline-flex; align-items:center; gap:7px; }
  #selbar #selDelete:hover { background:var(--danger-h); }
  #selbar #selDelete:disabled { background:var(--line2); }
  #selbar #selDelete svg { width:17px; height:17px; }

  label { font-size:12px; color:var(--muted); display:block; margin:13px 2px 5px; font-weight:500; }
  label .req { color:var(--danger); }

  input[type=text], textarea {
    width:100%; background:var(--bg2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px; font-size:16px; /* >=16px: iOS Safari не зумит при фокусе */
    font-family:inherit;
    transition:border-color .12s, box-shadow .12s;
  }
  input[type=text]:focus, textarea:focus {
    outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(58,123,213,.18);
  }
  textarea { min-height:64px; resize:vertical; }
  .invalid { border-color:var(--danger) !important; box-shadow:0 0 0 3px rgba(211,86,80,.18) !important; }

  button { border:none; border-radius:10px; padding:11px 14px; font-size:15px; cursor:pointer;
    color:#fff; background:var(--blue); font-weight:600; font-family:inherit;
    touch-action:manipulation; transition:background .12s; }
  button:active { background:var(--blue-h); }
  button:hover { background:var(--blue-h); }
  button:disabled { opacity:.6; cursor:default; }
  button.green { background:var(--accent); width:100%; padding:15px; font-size:16px; }
  button.green:hover, button.green:active { background:var(--accent-h); }
  button.ghost { background:transparent; border:1px solid var(--line2); color:var(--muted); font-weight:500; }
  button.ghost:hover, button.ghost:active { background:var(--card2); color:var(--text); }
  button.icon { background:transparent; color:var(--muted2); padding:7px; display:inline-flex;
    align-items:center; justify-content:center; }
  button.icon:hover, button.icon:active { background:var(--card2); color:var(--danger); }
  button.icon svg { width:18px; height:18px; display:block; }

  /* иконки статусов в результатах */
  .res .mk { display:inline-flex; align-items:center; gap:5px; vertical-align:middle; font-weight:600; }
  .res .mk svg { width:16px; height:16px; flex:none; }
  .res.ok .mk { color:var(--accent); }
  .res.failed .mk { color:var(--danger); }
  .res.unconfirmed .mk { color:var(--warn); }
  .res.running .mk { color:var(--blue); }
  .res .mk.wait { color:var(--muted2); }
  .spin { animation:spin 1s linear infinite; transform-origin:center; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .empty svg { width:46px; height:46px; opacity:.5; margin-bottom:10px; }

  .seg { display:flex; gap:8px; }
  .seg button { flex:1; background:var(--bg2); border:1px solid var(--line); color:var(--muted); font-weight:500; }
  .seg button:hover { background:var(--card2); color:var(--text); }
  .seg button.active { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
  .seg.object button.active { background:var(--accent); border-color:var(--accent); }

  .workers { margin-bottom:8px; }
  .worker { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .worker .num { width:22px; text-align:center; color:var(--muted2); font-size:13px; flex:none; }
  .worker input { flex:1; min-width:0; }
  .worker input.dup { border-color:var(--warn); box-shadow:0 0 0 3px rgba(217,164,65,.15); }

  /* недавние рабочие места — подставить в один тап */
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chips:empty { display:none; }
  .chip { background:var(--bg2); border:1px solid var(--line); color:var(--muted); font-weight:500;
    font-size:13px; padding:7px 11px; border-radius:16px; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip:hover, .chip:active { background:var(--card2); color:var(--text); }

  .divider { height:1px; background:var(--line); margin:16px -16px; }

  .muted { color:var(--muted); font-size:13px; }
  .hint { color:var(--muted2); font-size:11px; margin:4px 2px 0; }

  .empty { text-align:center; color:var(--muted2); padding:48px 16px; }

  /* ---- плашка «что программа впишет в форму» ---- */
  .plan { border:1px solid var(--line); border-radius:12px; background:var(--bg2);
    margin-top:14px; overflow:hidden; }
  .plan > summary { list-style:none; cursor:pointer; padding:12px 14px;
    display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600;
    color:var(--text); -webkit-user-select:none; user-select:none; }
  .plan > summary::-webkit-details-marker { display:none; }
  .plan > summary:hover { background:var(--card2); }
  .plan .chev { width:16px; height:16px; flex:none; color:var(--muted2);
    transition:transform .15s; }
  .plan[open] > summary .chev { transform:rotate(90deg); }
  .plan .cnt { margin-left:auto; font-size:11.5px; font-weight:600; color:var(--muted2);
    background:var(--card2); border-radius:20px; padding:3px 9px; flex:none; }
  .plan-body { padding:2px 14px 14px; border-top:1px solid var(--line); }
  .plan-sec { font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted2); font-weight:700; margin:14px 0 7px; }
  .plan-row { padding:9px 0; border-top:1px solid var(--line); }
  .plan-row:first-of-type { border-top:none; }
  .plan-q { font-size:12.5px; color:var(--muted); margin-bottom:4px; }
  .plan-val { font-size:14px; color:var(--text); white-space:pre-wrap; word-break:break-word; }
  .plan-val.clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden; }
  .plan-more { background:none; border:none; padding:3px 0 0; color:var(--blue);
    font-size:12px; font-weight:600; }
  .plan-more:hover, .plan-more:active { background:none; color:var(--blue-h); }
  .plan-val.empty-val { color:var(--danger); font-style:italic; }
  .plan-tag { display:inline-block; font-size:10.5px; font-weight:700; border-radius:5px;
    padding:1px 6px; margin-left:6px; vertical-align:1px; letter-spacing:.2px; }
  .tag-worker  { background:rgba(58,123,213,.18); color:#8ab6ee; }
  .tag-session { background:rgba(217,164,65,.18); color:#e0b665; }
  .tag-block   { background:rgba(47,165,102,.18); color:#63c795; }
  .tag-constant{ background:rgba(142,160,178,.15); color:var(--muted); }
  .plan-note { font-size:11.5px; color:var(--muted2); margin-top:3px; }
  .plan-legend { font-size:11.5px; color:var(--muted2); padding:10px 0 0; line-height:1.7; }
  .plan-ok { color:var(--accent); }
  .plan-bad { color:var(--danger); }

  /* прогресс */
  .progressWrap { margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
  .job-head { display:flex; align-items:baseline; gap:8px; }
  .job-title { font-weight:650; font-size:15px; }
  .job-when { margin-left:auto; font-size:12px; color:var(--muted2); white-space:nowrap; }
  .progressText.offline { color:var(--warn); }
  .job-note { font-size:12.5px; color:var(--muted); margin-top:8px; padding:9px 11px; line-height:1.5;
    background:var(--bg2); border:1px dashed var(--line2); border-radius:9px; }
  .bar { height:8px; background:var(--bg2); border-radius:6px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:linear-gradient(90deg,var(--accent),var(--blue)); width:0%;
    transition:width .3s linear; }
  .results { margin-top:10px; }
  .res { padding:10px 12px; border-radius:10px; margin-bottom:8px; font-size:14px;
    background:var(--bg2); border-left:4px solid var(--line); }
  .res.ok { border-left-color:var(--accent); }
  .res.failed { border-left-color:var(--danger); }
  .res.unconfirmed { border-left-color:var(--warn); }
  .res.running { border-left-color:var(--blue); }
  .res .head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .res .head b { min-width:0; overflow-wrap:anywhere; }
  .res .took { margin-left:auto; font-size:11.5px; color:var(--muted2); }
  .res .errs { color:#eb9; font-size:12px; margin-top:5px; white-space:pre-wrap; }
  .res .warns { color:var(--warn); font-size:12px; margin-top:5px; white-space:pre-wrap; }
  .res .plan { margin-top:9px; background:var(--bg); }

  details.steps summary { cursor:pointer; color:var(--muted2); font-size:12px; margin-top:6px;
    -webkit-user-select:none; user-select:none; }
  details.steps pre { white-space:pre-wrap; font-size:12px; color:var(--muted); background:var(--bg);
    padding:8px; border-radius:8px; margin-top:6px; }

  /* модалка */
  .overlay { position:fixed; inset:0; background:rgba(4,8,12,.68);
    display:grid; place-items:center; z-index:50; padding:18px; animation:fade .12s ease both; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .modal { width:100%; max-width:420px; background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line2); border-radius:16px; padding:20px; box-shadow:var(--shadow);
    animation:pop .16s cubic-bezier(.2,.8,.3,1.1) both; max-height:86vh; overflow-y:auto; }
  @keyframes pop { from{opacity:0; transform:scale(.97) translateY(6px)} to{opacity:1; transform:none} }
  .modal h3 { margin:0 0 6px; font-size:18px; }
  .modal p { margin:0 0 14px; color:var(--muted); font-size:14px; }
  .modal .actions { display:flex; gap:10px; margin-top:18px; }
  .modal .actions button { flex:1; }
  .modal .summary { background:var(--bg2); border:1px solid var(--line); border-radius:10px;
    padding:12px; font-size:13px; margin-bottom:6px; }
  .modal .summary div { display:flex; justify-content:space-between; gap:10px; padding:3px 0; }
  .modal .summary b { color:var(--text); font-weight:600; text-align:right; overflow-wrap:anywhere; }
  .modal .summary span { color:var(--muted); flex:none; }
  .modal ol.names { margin:0 0 10px; padding:9px 12px 9px 34px; background:var(--bg2);
    border:1px solid var(--line); border-radius:10px; font-size:14px; max-height:32vh; overflow-y:auto; }
  .modal ol.names li { padding:2px 0; overflow-wrap:anywhere; }
  .modal .m-warn { color:var(--warn); font-size:13px; margin:0 0 10px; }

  /* тосты */
  #toasts { position:fixed; left:0; right:0; z-index:60; display:flex;
    flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 14px;
    bottom:calc(18px + env(safe-area-inset-bottom)); }
  .toast { background:var(--card2); border:1px solid var(--line2); color:var(--text);
    padding:12px 16px; border-radius:12px; font-size:14px; box-shadow:var(--shadow);
    max-width:420px; width:100%; border-left:4px solid var(--blue);
    animation:rise .18s ease both; }
  @keyframes rise { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  .toast.ok { border-left-color:var(--accent); }
  .toast.err { border-left-color:var(--danger); }
  .toast { display:flex; align-items:center; gap:10px; pointer-events:auto; }
  .toast .t-msg { flex:1; min-width:0; overflow-wrap:anywhere; }
  .toast .t-act { background:transparent; color:var(--blue-h); padding:6px 8px; font-size:14px; flex:none; }
  .toast .t-act:hover, .toast .t-act:active { background:var(--card); }

  /* ---- detail-бар (экран одной бригады) ---- */
  #detailBar { display:none; position:sticky; top:0; z-index:20;
    align-items:center; gap:6px; padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));
    background:var(--barbg); border-bottom:1px solid var(--line); }
  body.detail #detailBar { display:flex; }
  body.detail #appHeader { display:none; }
  #detailView { display:none; }
  body.detail #detailView { display:block; }
  body.detail #listView { display:none; }
  #detailBar .back { background:transparent; color:var(--text); padding:8px; display:inline-flex; }
  #detailBar .back:hover, #detailBar .back:active { background:var(--card2); }
  #detailBar .back svg { width:22px; height:22px; }
  #detailBar .dname { flex:1; font-size:17px; font-weight:650; background:transparent; border:none;
    color:var(--text); padding:8px 6px; border-radius:8px; min-width:0; }
  #detailBar .dname:focus { background:var(--bg2); outline:1px solid var(--line2); }
  /* индикатор сохранения: иконка, чтобы не отъедать ширину у названия;
     текст — только когда что-то не сохранилось */
  #saveState { display:inline-flex; align-items:center; gap:5px; flex:none; font-size:12px;
    color:var(--muted2); white-space:nowrap; transition:opacity .4s; }
  #saveState svg { width:16px; height:16px; }
  #saveState.ok { color:var(--accent); }
  #saveState.idle { opacity:0; }
  #saveState.err { color:var(--danger); font-weight:600; cursor:pointer; }

  /* ---- список бригад (главный экран) ---- */
  .row {
    display:flex; align-items:center; gap:12px; position:relative;
    background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.22); cursor:pointer;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
    transition:border-color .12s, background-color .12s;
  }
  .row.lp-armed { border-color:var(--line2); background:var(--card2); }
  .row .row-check { width:24px; height:24px; border-radius:50%; border:2px solid var(--line2);
    background:var(--bg2); display:none; place-items:center; color:transparent; flex:none; }
  .row .row-check svg { width:15px; height:15px; }
  body.selecting .row { cursor:default; }
  body.selecting .row .row-check { display:grid; }
  .row.selected { border-color:var(--blue); }
  .row.selected .row-check { background:var(--blue); border-color:var(--blue); color:#fff; }
  .row .row-main { flex:1; min-width:0; }
  .row .row-name { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .row-sub { font-size:12.5px; color:var(--muted2); margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .row-job { display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    color:var(--muted2); margin-top:6px; min-width:0; }
  .row .row-job span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .row-job svg { width:14px; height:14px; flex:none; }
  .row .row-job.ok { color:var(--accent); }
  .row .row-job.warn { color:var(--warn); }
  .row .row-job.bad { color:var(--danger); }
  .row .row-job.run { color:var(--blue-h); }
  .row:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .empty .retry { margin-top:14px; }
  .row .row-chevron { color:var(--muted2); flex:none; display:flex; }
  .row .row-chevron svg { width:20px; height:20px; }
  body.selecting .row .row-chevron { display:none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  /* узкие экраны телефонов */
  @media (max-width:480px) {
    .wrap { padding:12px 10px; }
    .card { padding:14px; border-radius:12px; }
    header h1 { font-size:15px; }
    header .sub { display:none; }
    header .h1-tail { display:none; }
    .seg button { padding:11px 6px; font-size:14px; }
    .divider { margin:14px -14px; }
    .modal { padding:18px; border-radius:14px; }
  }
  @media (max-width:360px) {
    .seg { gap:6px; }
    .seg button { font-size:13px; }
  }
</style>
</head>
<body>
<header id="appHeader">
  <div class="brand">
    <div class="logo">SL</div>
    <div>
      <h1>SLAM<span class="h1-tail"> — автозаполнение</span></h1>
      <div class="sub">оценка рисков · заполнение за бригаду</div>
    </div>
  </div>
  <button id="addBlock" type="button">+ Бригада</button>
</header>

<div id="detailBar">
  <button class="back" id="backBtn" type="button" title="Назад" aria-label="Назад к списку бригад">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <input class="dname" id="detailName" type="text" placeholder="Название бригады" maxlength="200" aria-label="Название бригады">
  <span id="saveState" role="status" aria-live="polite"></span>
  <button class="icon" id="detailDelete" type="button" title="Удалить бригаду" aria-label="Удалить бригаду">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
  </button>
</div>

<div id="selbar">
  <button class="ghost" id="selCancel" type="button">Отмена</button>
  <div class="selcount">Выбрано: <b id="selCount">0</b></div>
  <button id="selDelete" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
    Удалить
  </button>
</div>

<div class="wrap">
  <div id="listView"></div>
  <div id="detailView"></div>
</div>

<div id="toasts"></div>

<template id="rowTpl">
  <div class="row" role="button" tabindex="0">
    <span class="row-check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4 4L19 7"/></svg>
    </span>
    <div class="row-main">
      <div class="row-name"></div>
      <div class="row-sub"></div>
      <div class="row-job" hidden></div>
    </div>
    <span class="row-chevron">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </span>
  </div>
</template>

<template id="detailTpl">
  <div class="card block">
    <label>Подрядная организация <span class="hint" style="display:inline">— сохраняется</span></label>
    <input class="company" type="text" placeholder="Например: ТОО «СтройМонтаж»" maxlength="300">

    <label>Тип работ <span class="muted">(вопрос 3)</span></label>
    <div class="seg task">
      <button data-v="montazh">Монтаж лесов</button>
      <button data-v="demontazh">Демонтаж лесов</button>
    </div>

    <label>Объект <span class="muted">(вопрос 5)</span></label>
    <div class="seg object">
      <button data-v="sulphide_1">Сульфид 1</button>
      <button data-v="sulphide_2">Сульфид 2</button>
    </div>

    <label>Наименование рабочего места <span class="req">*</span></label>
    <textarea class="workplace" placeholder="Где именно проводятся работы" maxlength="1000"></textarea>
    <div class="chips recentWp" aria-label="Недавние рабочие места"></div>
    <div class="hint">Меняется каждый раз. Сохраняется только на этом устройстве.</div>

    <div class="divider"></div>

    <label>Бригада <span class="muted">(ФИО — сохраняются)</span></label>
    <div class="workers"></div>
    <button class="ghost addWorker" style="width:100%">+ Добавить работника</button>

    <details class="plan planPreview">
      <summary>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        <span>Что программа впишет в форму</span>
        <span class="cnt">—</span>
      </summary>
      <div class="plan-body"></div>
    </details>

    <div style="height:14px"></div>
    <button class="green doSubmit">Отправить за всю бригаду</button>

    <div class="progressWrap" hidden>
      <div class="job-head"><span class="job-title"></span><span class="job-when"></span></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="muted progressText" aria-live="polite"></div>
      <div class="job-note" hidden>Отправка идёт на сервере — телефон можно убрать, приложение свернуть
        или закрыть. Ход и итог будут здесь, когда вернётесь.</div>
      <div class="results"></div>
    </div>
  </div>
</template>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
